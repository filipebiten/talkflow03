<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TalkFlow 03 — Premiação &amp; Revanche — Rede Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" integrity="sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k" crossorigin="anonymous"></script>
<style>
:root{
  --preto:#0A0A0A;
  --preto-suave:#161616;
  --off-white:#EBE8E0;
  --teal:#186678;
  --teal-claro:#2589A0;
  --teal-escuro:#0F4856;
  --cinza-claro:#D8D4CA;
  --ease:cubic-bezier(.32,.72,0,1);
  --font-display:'Bebas Neue',Impact,Oswald,sans-serif;
  --font-body:'Plus Jakarta Sans',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--preto);color:var(--off-white);font-family:var(--font-body);overflow-x:hidden;}
#app{position:relative;min-height:100vh;}
button,input,select{font-family:var(--font-body);}
a{color:var(--teal-claro);}

.bg-layer{position:fixed;inset:0;pointer-events:none;z-index:0;}
.bg-waves{opacity:.07;background-repeat:no-repeat,no-repeat;
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='900'><g fill='none' stroke='%232589A0' stroke-width='5'><circle cx='450' cy='450' r='90'/><circle cx='450' cy='450' r='180'/><circle cx='450' cy='450' r='270'/><circle cx='450' cy='450' r='360'/><circle cx='450' cy='450' r='450'/></g></svg>"),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><g fill='none' stroke='%23186678' stroke-width='4'><circle cx='300' cy='300' r='60'/><circle cx='300' cy='300' r='130'/><circle cx='300' cy='300' r='200'/><circle cx='300' cy='300' r='270'/></g></svg>");
  background-position:right -220px bottom -220px, left -160px top -160px;
  background-size:900px 900px, 600px 600px;
}
.bg-grain{opacity:.045;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

.display{font-family:var(--font-display);text-transform:uppercase;letter-spacing:-0.01em;}
.display-huge{font-size:clamp(3.5rem,13vw,11rem);line-height:.94;}
.display-lg{font-size:clamp(2.2rem,7vw,5.5rem);line-height:1;}
.display-md{font-size:clamp(1.4rem,4vw,2.6rem);line-height:1.05;}
.accent{color:var(--teal-claro);}

.btn{font-weight:700;padding:16px 30px;border-radius:999px;border:2px solid transparent;cursor:pointer;font-size:1.05rem;background:transparent;color:var(--off-white);transition:transform .25s var(--ease),background .25s var(--ease),border-color .25s var(--ease),opacity .25s var(--ease);}
.btn-primary{background:var(--teal);}
.btn-primary:hover{background:var(--teal-claro);transform:translateY(-2px);}
.btn-outline{border-color:var(--cinza-claro);}
.btn-outline:hover{border-color:var(--teal-claro);color:var(--teal-claro);}
.btn-ghost{border:none;color:var(--cinza-claro);padding:8px 14px;font-size:.9rem;}
.btn-ghost:hover{color:var(--off-white);}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none;}
.btn-sm{padding:8px 16px;font-size:.85rem;border-radius:999px;}
.btn-block{width:100%;}

.card{background:var(--preto-suave);border-radius:18px;padding:18px;border:1px solid rgba(216,212,202,.10);}
.pill{display:inline-block;padding:4px 14px;border-radius:999px;border:1px solid var(--teal-claro);color:var(--teal-claro);font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}

input[type=text],input[type=number]{background:var(--preto-suave);border:1px solid var(--cinza-claro);color:var(--off-white);border-radius:10px;padding:10px 12px;font-size:1rem;}
input[type=text]:focus,input[type=number]:focus{outline:none;border-color:var(--teal-claro);}
input[type=number]{width:90px;}
select{background:var(--preto-suave);border:1px solid var(--cinza-claro);color:var(--off-white);border-radius:8px;padding:6px 8px;font-size:.9rem;}

::-webkit-scrollbar{width:10px;}
::-webkit-scrollbar-thumb{background:var(--preto-suave);border-radius:10px;}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
@keyframes popIn{from{opacity:0;transform:scale(.55) translateY(30px);}to{opacity:1;transform:scale(1) translateY(0);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
@keyframes pulseScale{0%,100%{transform:scale(1);}50%{transform:scale(1.04);}}
.fade-up{animation:fadeUp .5s var(--ease);}
.pop-in{animation:popIn .6s var(--ease);}
.pulse{animation:pulse 1.8s ease-in-out infinite;}
.pulse-scale{animation:pulseScale 2.2s ease-in-out infinite;}

/* ---- landing ---- */
.landing{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;padding:24px;position:relative;z-index:1;}
.landing img.logo{width:min(60vw,220px);}
.landing .buttons{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}

/* ---- telão ---- */
.stage{min-height:100vh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4vw;position:relative;z-index:1;gap:2vh;}
.logo-corner{position:fixed;top:28px;left:28px;width:90px;opacity:.85;z-index:2;}
.stage-kicker{font-size:clamp(1rem,2vw,1.4rem);color:var(--teal-claro);font-weight:700;letter-spacing:.12em;text-transform:uppercase;}
.categoria-emoji{font-size:clamp(4rem,12vw,9rem);line-height:1;}
.premio-explicacao{color:var(--cinza-claro);font-size:clamp(1.1rem,2.8vw,1.6rem);}

.trophy-wrap{position:relative;width:min(40vw,260px);margin:0 auto;}
.trophy-emoji{position:absolute;top:8%;left:50%;transform:translateX(-50%);font-size:clamp(2.2rem,7vw,4.5rem);}
.vencedor-nome{font-family:var(--font-display);font-size:clamp(3.2rem,10vw,8rem);line-height:1;color:var(--teal-claro);}
.vencedor-votos{color:var(--cinza-claro);font-size:clamp(.95rem,2vw,1.2rem);}
.pod23{display:flex;flex-direction:column;gap:6px;margin-top:10px;color:var(--cinza-claro);font-size:clamp(.9rem,1.8vw,1.1rem);}
.pod23-pos{font-family:var(--font-display);color:var(--teal-claro);margin-right:6px;}
.pod23-votos{color:var(--cinza-claro);margin-left:6px;}

canvas.confetti{position:fixed;inset:0;z-index:6;pointer-events:none;}

.fechamento-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;width:min(92vw,1100px);}
.fechamento-item{background:var(--preto-suave);border-radius:16px;padding:16px;border:1px solid rgba(216,212,202,.1);text-align:left;}
.fechamento-item .premio{font-size:.75rem;color:var(--cinza-claro);text-transform:uppercase;letter-spacing:.05em;}
.fechamento-item .vencedor{font-family:var(--font-display);font-size:1.3rem;color:var(--teal-claro);}

.rank-list{width:min(84vw,920px);display:flex;flex-direction:column;gap:14px;margin-top:1vh;}
.rank-row{display:flex;align-items:center;gap:18px;}
.rank-name{width:min(32vw,280px);text-align:right;font-family:var(--font-display);font-size:clamp(1.1rem,2.4vw,2rem);flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;gap:8px;}
.rank-track{flex:1;position:relative;background:rgba(216,212,202,.08);border-radius:14px;height:clamp(32px,4.6vw,50px);overflow:hidden;}
.rank-bar{position:absolute;inset:0;border-radius:14px;transform-origin:left center;transition:transform 1s var(--ease),background 1s var(--ease);}
.rank-row.lider .rank-name{color:var(--teal-claro);}
.rank-value{font-family:var(--font-display);font-size:clamp(1rem,1.8vw,1.5rem);width:clamp(3rem,6vw,4.5rem);text-align:right;flex-shrink:0;color:var(--off-white);}
.seta{font-size:1rem;}
.seta.up{color:#3DDC84;}
.seta.down{color:#E05252;}

.podium-wrap{display:flex;align-items:flex-end;gap:22px;justify-content:center;width:100%;max-width:760px;flex-wrap:wrap;}
.podium-slot{display:flex;flex-direction:column;align-items:center;gap:10px;}
.podium-block{width:min(28vw,240px);border-radius:16px 16px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:14px;}
.podium-rank{font-family:var(--font-display);font-size:2.2rem;}
.podium-name{font-family:var(--font-display);font-size:clamp(1.2rem,2.6vw,2rem);}
.campeao-antes{color:var(--cinza-claro);font-size:.95rem;margin-top:8px;}
.rank-countdown{display:flex;flex-direction:column;gap:4px;align-items:center;}
.rank-countdown-item{font-family:var(--font-display);font-size:1.1rem;color:var(--cinza-claro);opacity:.55;letter-spacing:.02em;}
.rank-countdown-item.destaque{font-size:1.8rem;color:var(--off-white);opacity:1;}
.rank-countdown-pos{color:var(--teal-claro);margin-right:8px;}

/* ---- painel ---- */
.control{min-height:100vh;display:flex;flex-direction:column;padding:16px 20px 20px;gap:14px;position:relative;z-index:1;}
.control-header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;}
.control-title{font-family:var(--font-display);font-size:1.5rem;letter-spacing:.03em;}
.header-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.control-main{flex:1;display:flex;flex-direction:column;gap:16px;}

.mode-tabs{display:flex;gap:8px;flex-wrap:wrap;}
.mode-tab{padding:10px 20px;border-radius:999px;border:2px solid var(--cinza-claro);background:transparent;color:var(--off-white);font-weight:700;cursor:pointer;font-size:.9rem;letter-spacing:.03em;}
.mode-tab.active{border-color:var(--teal-claro);background:rgba(37,137,160,.18);color:var(--teal-claro);}

.categoria-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.categoria-nav .pos{font-family:var(--font-display);font-size:1.1rem;color:var(--cinza-claro);}
.vencedor-edit{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.vencedor-edit input[type=text]{flex:1;min-width:160px;}
.categoria-list{display:flex;flex-direction:column;gap:4px;max-height:40vh;overflow:auto;}
.categoria-list-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:.9rem;}
.categoria-list-item:hover{background:var(--preto-suave);}
.categoria-list-item.current{background:rgba(24,102,120,.22);}
.categoria-list-item .cemoji{font-size:1.1rem;}
.categoria-list-item .cpremio{flex:1;}
.categoria-list-item .cvencedor{color:var(--cinza-claro);font-size:.8rem;}

.equipes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.equipe-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--preto-suave);border-radius:10px;padding:8px 10px;border-left:4px solid var(--cor);}
.equipe-row .nome{flex:1;font-weight:700;font-size:.9rem;}
.equipe-row .pontos{font-family:var(--font-display);font-size:1.1rem;width:52px;text-align:center;}
.stepper{display:flex;align-items:center;gap:4px;}
.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--cinza-claro);background:transparent;color:var(--off-white);cursor:pointer;font-size:.9rem;}

.posicao-grid{display:flex;flex-direction:column;gap:6px;}
.posicao-row{display:flex;align-items:center;gap:10px;background:var(--preto-suave);border-radius:10px;padding:8px 10px;border-left:4px solid var(--cor);}
.posicao-row .nome{flex:1;font-weight:700;}

.adjust-panel{background:var(--preto-suave);border-radius:14px;padding:12px 16px;}
.adjust-panel summary{cursor:pointer;font-weight:700;color:var(--cinza-claro);}

.kbd-hint{font-size:.75rem;color:var(--cinza-claro);}
.kbd-hint kbd{background:var(--preto-suave);border:1px solid var(--cinza-claro);border-radius:4px;padding:1px 6px;font-family:var(--font-body);}

/* ---- gincana: telão ---- */
.proximo-em{position:absolute;bottom:18px;right:22px;font-size:.8rem;color:var(--cinza-claro);letter-spacing:.03em;}
.contagem-grande{font-family:var(--font-display);font-size:clamp(2.5rem,8vw,5rem);color:var(--teal-claro);}
.qr-box{background:#fff;padding:14px;border-radius:14px;}
.bloco10-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(92vw,760px);}
.bloco10-cel{background:var(--preto-suave);border-radius:10px;padding:10px 8px;border-left:4px solid var(--cor);text-align:left;font-size:.85rem;}
.bloco10-cel b{display:block;font-family:var(--font-display);font-size:1.3rem;letter-spacing:.02em;}
.bloco10-cel .valor{color:var(--cinza-claro);}
.bloco10-cel.acertou{outline:2px solid #3DDC84;}
.bloco10-cel.errou{outline:2px solid #E05252;}
.resultado-cel{border-radius:10px;padding:10px 8px;text-align:left;font-size:.85rem;}
.resultado-cel b{display:block;font-family:var(--font-display);font-size:1.3rem;letter-spacing:.02em;}
.resultado-cel.acertou{outline:3px solid #3DDC84;}
.resultado-cel.errou{outline:3px solid #E05252;opacity:.6;}
.pista-telao{font-size:clamp(1.3rem,3.6vw,2.2rem);max-width:900px;}

/* ---- gincana: celular (?view=time) ---- */
.time{min-height:100vh;display:flex;flex-direction:column;padding:5vw 6vw;gap:18px;position:relative;z-index:1;}
.time-header{display:flex;align-items:center;justify-content:space-between;}
.time-pill{padding:6px 16px;border-radius:999px;font-weight:800;font-size:.85rem;color:#000;}
.time-pontos{font-family:var(--font-display);font-size:1.3rem;}
.time-body{flex:1;display:flex;flex-direction:column;gap:18px;justify-content:center;}
.resultado-time{font-family:var(--font-display);font-size:2.4rem;}
.resultado-time.acertou{color:#3DDC84;}
.resultado-time.errou{color:#E05252;}
.cor-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.cor-btn{border-radius:14px;padding:18px;font-weight:800;font-size:1rem;border:2px solid transparent;color:#000;cursor:pointer;}
.stepper{display:flex;align-items:center;gap:16px;justify-content:center;}
.stepper button{width:54px;height:54px;border-radius:14px;border:1px solid var(--cinza-claro);background:transparent;color:var(--off-white);font-size:1.4rem;cursor:pointer;}
.stepper .val{font-family:var(--font-display);font-size:2.2rem;width:80px;text-align:center;}
.opcoes-time{display:flex;flex-direction:column;gap:10px;}
.opcao-time{background:var(--preto-suave);border:2px solid rgba(216,212,202,.2);border-radius:14px;padding:16px;font-size:1.05rem;text-align:left;color:var(--off-white);cursor:pointer;}
.opcao-time.sel{border-color:var(--teal-claro);background:rgba(37,137,160,.15);}
.cronos-time-list{display:flex;flex-direction:column;gap:8px;}
.cronos-time-item{background:var(--preto-suave);border:1px solid rgba(216,212,202,.18);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:.92rem;cursor:grab;touch-action:none;}
.cronos-time-item .alca{color:var(--cinza-claro);font-size:1.1rem;}
.cronos-setas{margin-left:auto;display:flex;gap:6px;}
.cronos-setas button{background:var(--preto);border:1px solid rgba(216,212,202,.3);color:var(--off-white);border-radius:8px;width:44px;height:44px;font-size:1.1rem;cursor:pointer;}
.cronos-setas button:disabled{opacity:.25;cursor:not-allowed;}
.cronos-time-item.arrastando{border-color:var(--teal-claro);box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:2;position:relative;transition:none;pointer-events:none;}
.quatro-time-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.quatro-time-cel{background:var(--preto-suave);border:2px solid rgba(216,212,202,.2);border-radius:10px;padding:10px 4px;font-size:.72rem;text-align:center;cursor:pointer;font-weight:700;}
.quatro-tema-label{font-family:var(--font-display);font-size:1rem;letter-spacing:.02em;color:var(--teal-claro);text-align:center;}
.quatro-time-cel.sel{border-color:var(--teal-claro);}
.quatro-time-cel.solved0{background:#2563EB55;border-color:#2563EB;}
.quatro-time-cel.solved1{background:#16A34A55;border-color:#16A34A;}
.quatro-time-cel.solved2{background:#EAB30855;border-color:#EAB308;}
.quatro-time-cel.solved3{background:#A78BFA55;border-color:#A78BFA;}
.pista-time-box{background:var(--preto-suave);border-radius:14px;padding:16px;font-size:1.05rem;}

@media (max-width:600px){
  .control{padding:12px 14px 18px;gap:12px;}
  .control-title{font-size:1.3rem;}
  .kbd-hint{display:none;}
  .btn{padding:15px 24px;font-size:1rem;min-height:48px;}
  .btn-sm{min-height:40px;padding:10px 16px;}
}
</style>
</head>

<div id="app"></div>

<script type="module">

/* =========================================================

const COR_HEX = {
  azul: '#2563EB', amarelo: '#EAB308', cinza: '#9CA3AF', vermelho: '#DC2626',

};
function corContraste(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return lum > 0.6 ? '#0A0A0A' : '#EBE8E0';
}
const EQUIPES_INICIAIS = [
  { nome: 'AZUL', cor: 'azul', pontos: 805 },

function normalizeTexto(s) { return String(s || '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' '); }
function avaliarEscolha(opcaoIdx, round) { return opcaoIdx === round.certaIdx; }
function avaliarCronos(ordemEnviada, round) { if (!Array.isArray(ordemEnviada) || ordemEnviada.length !== round.itens.length) return false; return ordemEnviada.every((v, i) => v === i); }
// o celular já valida cada grupo contra round.grupos ao vivo (via a origem de cada
// palavra sorteada) — aqui só confirmamos que achou os 4 grupos inteiros.
function avaliarQuatro(valor, round) { return !!valor && valor.gruposResolvidos === round.grupos.length; }
function avaliarPistas(texto, resposta) {
  const chute = normalizeTexto(texto);
  const certa = normalizeTexto(resposta);
  if (chute === certa) return true;
  // aceita variações como "samaritana" ou "mulher samaritana" pra resposta
  // "a mulher samaritana" — exige só as palavras com peso (ignora artigos).
  const stop = new Set(['a', 'o', 'e', 'de', 'da', 'do']);
  const palavrasCerta = certa.split(' ').filter((w) => w && !stop.has(w));
  return palavrasCerta.length > 0 && palavrasCerta.every((w) => chute.includes(w));
}

let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function beep(freq, start, dur, type, gain) {
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  g.gain.value = gain || 0.2;
  osc.connect(g); g.connect(ctx.destination);
  const t0 = ctx.currentTime + start;
  osc.start(t0);
  g.gain.setValueAtTime(g.gain.value, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.stop(t0 + dur + 0.02);
}

/* =========================================================
   RELÓGIO AUTÔNOMO — deadlineAt (epoch ms) vem do Firebase;
   cada cliente calcula localmente quanto falta. pausedRemainingMs
   congela a contagem quando paused=true.
   ========================================================= */
function useContagem(deadlineAt, paused, pausedRemainingMs) {
  const [, force] = useState(0);
  useEffect(() => {
    if (paused) return;
    const id = setInterval(() => force((n) => n + 1), 250);
    return () => clearInterval(id);
  }, [paused, deadlineAt]);
  if (paused) return Math.max(0, pausedRemainingMs || 0);
  if (!deadlineAt) return 0;
  return Math.max(0, deadlineAt - Date.now());
}
function abrirContagem(segundos) { return { deadlineAt: Date.now() + segundos * 1000 }; }

/* =========================================================
   FLIP — anima reordenação de elementos (placar, 4x4) sem
   trocar a estrutura do DOM: mede antes/depois e compensa
   com transform, deixando o CSS transition fazer o resto.
   ========================================================= */
function useFlip(containerRef, opts) {
  const duration = (opts && opts.duration) || .6;
  const easing = (opts && opts.easing) || 'cubic-bezier(.32,.72,0,1)';
  const scaleFrom = opts && opts.scaleFrom;
  const dep = opts && opts.dep;
  const prevRects = useRef(new Map());
  const lastDep = useRef(undefined);
  useLayoutEffect(() => {
    // sem isso, qualquer re-render alheio (ex: o relógio da contagem regressiva
    // piscando a cada 250ms no componente pai) reentra aqui no meio de uma
    // transição em andamento e reseta o transform — é isso que piscava.
    if (dep !== undefined) { if (dep === lastDep.current) return; lastDep.current = dep; }
    const el = containerRef.current;
    if (!el) return;
    const nodes = el.querySelectorAll('[data-flip-key]');
    const next = new Map();
    nodes.forEach((node) => next.set(node.dataset.flipKey, node.getBoundingClientRect()));
    nodes.forEach((node) => {
      const key = node.dataset.flipKey;
      const prev = prevRects.current.get(key);
      const now = next.get(key);
      if (!prev || !now) return;
      const dx = prev.left - now.left, dy = prev.top - now.top;
      if (!dx && !dy) return;
      node.style.transition = 'none';
      node.style.transform = `translate(${dx}px,${dy}px)${scaleFrom ? ` scale(${scaleFrom})` : ''}`;
      requestAnimationFrame(() => {
        node.style.transition = `transform ${duration}s ${easing}`;
        node.style.transform = '';
      });
    });
    prevRects.current = next;
  });
}

   CONFETE
   ========================================================= */
function Confetti() {
  const ref = useRef(null);
  useEffect(() => {
    const canvas = ref.current;
    const ctx = canvas.getContext('2d');
    let raf = 0;
    const colors = ['#EBE8E0', '#186678', '#2589A0', '#D8D4CA'];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);
    const particles = Array.from({ length: 180 }, () => ({
      x: Math.random() * canvas.width, y: -20 - Math.random() * canvas.height,
      w: 6 + Math.random() * 8, h: 6 + Math.random() * 10,
      vy: 1.5 + Math.random() * 2.5, vx: -1 + Math.random() * 2,
      rot: Math.random() * Math.PI, vrot: -0.15 + Math.random() * 0.3,
      color: colors[Math.floor(Math.random() * colors.length)],
    }));
    function frame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p) => {
        p.y += p.vy; p.x += p.vx; p.rot += p.vrot;
        if (p.y > canvas.height + 20) { p.y = -20; p.x = Math.random() * canvas.width; }
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      });
      raf = requestAnimationFrame(frame);
    }
    frame();
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', resize); };
  }, []);
  return html`<canvas class="confetti" ref=${ref}></canvas>`;
}

function PlacarBars({ equipes, prevRanking, destaque }) {
  const containerRef = useRef(null);
  // ordena pela posição ANTERIOR primeiro (se disponível) — assim o placar
  // "aparece como estava" no primeiro frame e só depois o FLIP abaixo anima
  // cada linha subindo/descendo até a posição nova.
  const ordemAtual = sortedEquipesIdx(equipes);
  const [ordemExibida, setOrdemExibida] = useState(() => (prevRanking && prevRanking.length ? prevRanking : ordemAtual));
  useEffect(() => {
    const t = setTimeout(() => setOrdemExibida(ordemAtual), 900);
    return () => clearTimeout(t);
    // eslint-disable-next-line
  }, [JSON.stringify(ordemAtual)]);
  useFlip(containerRef, { duration: 3, easing: 'cubic-bezier(.16,1,.3,1)', scaleFrom: 1.12, dep: ordemExibida.join(',') });
  const max = equipes[ordemAtual[0]].pontos || 1;
  return html`
    <div class="rank-list" ref=${containerRef}>
      ${ordemExibida.map((idx, pos) => {
        const e = equipes[idx];
        let seta = '';
        if (prevRanking) {
          const prevPos = prevRanking.indexOf(idx);
          const posNova = ordemAtual.indexOf(idx);
          if (prevPos > posNova) seta = html`<span class="seta up">▲</span>`;
          else if (prevPos < posNova) seta = html`<span class="seta down">▼</span>`;
        }
        return html`
          <div class="rank-row ${pos === 0 ? 'lider' : ''}" key=${idx} data-flip-key=${idx}>
            <div class="rank-name">${seta}${e.nome}</div>
            <div class="rank-track">
              <div class="rank-bar" style=${{ background: COR_HEX[e.cor], transform: `scaleX(${Math.max(e.pontos, 0) / max})` }}></div>
            </div>
            <span class="rank-value">${e.pontos}</span>
          </div>
        `;
      })}
    </div>
  `;
}
/* =========================================================
   REVANCHE — motor autônomo (o telão é quem escreve as
   transições de fase e as correções; painel só escreve
   overrides manuais e paused/pausedRemainingMs; cada celular
   só escreve sua própria entrada em apostas/respostas/
   timeConectado).
   ========================================================= */
function updateRevanche(patch) {
  const updates = {};
  Object.entries(patch).forEach(([k, v]) => { updates[`talkflow/talkflow03/revanche/${k}`] = v; });
  return update(dbRef(db), updates);
}
function updateTop(patch) {
  const updates = {};
  Object.entries(patch).forEach(([k, v]) => { updates[`talkflow/talkflow03/${k}`] = v; });
  return update(dbRef(db), updates);
}
function avaliarRodada(tipo, valor, round) {
  if (valor === undefined || valor === null) return false;
  if (tipo === 'escolha') return avaliarEscolha(valor, round);
  if (tipo === 'cronos') return avaliarCronos(valor, round);
  if (tipo === 'quatro') return avaliarQuatro(valor, round);
  if (tipo === 'pistas') return avaliarPistas(valor, round.resposta);
  return false;
}
function resolverRodadaPatch(r, bloco, corretas) {
  let primeiroAcerto = null, menorTempo = Infinity;
  const acertosBloco = { ...r.acertosBloco };
  const equipes = r.equipes.map((e, idx) => {
    const correta = !!corretas[idx];
    if (correta) acertosBloco[idx] = (acertosBloco[idx] || 0) + 1;
    const resp = (r.respostas || {})[idx];
    if (correta && resp && resp.tempoMs < menorTempo) { menorTempo = resp.tempoMs; primeiroAcerto = idx; }
    let pontos = e.pontos;
    if (bloco.tipo === 'pistas' && correta && resp) pontos += bloco.valoresPista[resp.pistaIndexNoAcerto != null ? resp.pistaIndexNoAcerto : bloco.valoresPista.length - 1];
    return { ...e, pontos };
  });
  if (primeiroAcerto !== null) equipes[primeiroAcerto] = { ...equipes[primeiroAcerto], pontos: equipes[primeiroAcerto].pontos + 5 };
  return { equipes, acertosBloco, primeiroAcerto, fase: 'resultadoRodada', deadlineAt: Date.now() + 8000 };
}
function useMotorRevanche(state) {
  const r = state.revanche;
  const ms = useContagem(r.deadlineAt, r.paused, r.pausedRemainingMs);
  const processandoRef = useRef(false);

  useEffect(() => {
    if (state.modo !== 'revanche' || r.paused || processandoRef.current) return;
    const bloco = blocoAtual(r);
    const round = rodadaAtual(r);
    const totalEquipes = r.equipes.length;
    function avancar(patch) { processandoRef.current = true; updateRevanche(patch).finally(() => { processandoRef.current = false; }); }

    if (r.fase === 'entrada') {
      const conectados = r.timeConectado.filter(Boolean).length;
      if (conectados >= totalEquipes && !r.deadlineAt) { updateRevanche({ deadlineAt: Date.now() + 5000 }); return; }
      if (r.deadlineAt && ms <= 0) avancar({ fase: 'aposta', blocoIndex: 0, apostas: {}, deadlineAt: Date.now() + bloco.tempoApostaSeg * 1000 });
      return;
    }
    if (r.fase === 'aposta') {
      const todos = Object.keys(r.apostas).length >= totalEquipes;
      if (todos || ms <= 0) {
        const apostas = { ...r.apostas };
        r.equipes.forEach((_, i) => { if (apostas[i] === undefined) apostas[i] = 0; });
        avancar({ apostas, fase: 'revelacaoAposta', deadlineAt: Date.now() + 4000 });
      }
      return;
    }
    if (r.fase === 'revelacaoAposta') {
      if (ms <= 0) avancar({ fase: 'rodada', respostas: {}, pistasVistas: {}, eliminadosPista: [], primeiroAcerto: null, deadlineAt: Date.now() + bloco.tempoRodadaSeg * 1000 });
      return;
    }
    if (r.fase === 'rodada') {
      const entradas = Object.entries(r.respostas || {});
      let algumAcerto = false;
      const corretas = {};
      entradas.forEach(([idx, resp]) => { const c = avaliarRodada(bloco.tipo, resp.valor, round); corretas[idx] = c; if (c) algumAcerto = true; });
      const encerraCedo = bloco.tipo === 'pistas' && algumAcerto;
      const todos = entradas.length >= totalEquipes;
      if (encerraCedo || todos || ms <= 0) {
        avancar(resolverRodadaPatch(r, bloco, corretas));
      } else if (bloco.tipo === 'pistas') {
        const novosErrados = entradas.filter(([idx]) => !corretas[idx]).map(([idx]) => Number(idx)).filter((idx) => !r.eliminadosPista.includes(idx));
        if (novosErrados.length) updateRevanche({ eliminadosPista: [...r.eliminadosPista, ...novosErrados] });
      }
      return;
    }
    if (r.fase === 'resultadoRodada') {
      if (ms <= 0) {
        if (r.rodadaIndex + 1 < totalRodadasBloco(r)) {
          avancar({ rodadaIndex: r.rodadaIndex + 1, respostas: {}, pistasVistas: {}, eliminadosPista: [], primeiroAcerto: null, fase: 'rodada', deadlineAt: Date.now() + bloco.tempoRodadaSeg * 1000 });
        } else {
          const prevRanking = sortedEquipesIdx(r.equipes);
          const equipes = r.equipes.map((e, idx) => ({ ...e, pontos: e.pontos + resolverAposta(r.apostas[idx] || 0, r.acertosBloco[idx] || 0, totalRodadasBloco(r)) }));
          avancar({ equipes, prevRanking, fase: 'resultadoBloco', deadlineAt: Date.now() + 20000 });
        }
      }
      return;
    }
    if (r.fase === 'resultadoBloco') {
      if (ms <= 0) {
        if (r.blocoIndex < BLOCOS_GINCANA.length) {
          const proximoBloco = blocoAtual({ ...r, blocoIndex: r.blocoIndex + 1 });
          avancar({ blocoIndex: r.blocoIndex + 1, rodadaIndex: 0, apostas: {}, respostas: {}, acertosBloco: {}, fase: 'aposta', deadlineAt: Date.now() + proximoBloco.tempoApostaSeg * 1000 });
        } else {
          avancar({ fase: 'podio', podioStep: 0 });
        }
      }
      return;
    }
  }, [state.modo, r.fase, r.paused, ms, r.respostas, r.apostas, r.timeConectado]);
  return ms;
}

/* ---- bots de teste: times 1-9 jogam sozinhos quando botsAtivos=true ---- */
function useBotsRevanche(state) {
  const r = state.revanche;
  const jaAgiu = useRef(new Set());
  useEffect(() => {
    if (state.modo !== 'revanche' || !r.botsAtivos || r.paused) return;
    const bloco = blocoAtual(r);
    const round = rodadaAtual(r);
    const chave = `${r.fase}-${r.blocoIndex}-${r.rodadaIndex}`;
    if (jaAgiu.current.has(chave)) return;
    jaAgiu.current.add(chave);
    for (let idx = 1; idx < r.equipes.length; idx++) {
      const atraso = 300 + Math.random() * 900;
      setTimeout(() => {
        const estadoAgora = r; // aproximação: ok pra bot de teste
        if (r.fase === 'aposta' && estadoAgora.apostas[idx] === undefined) {
          updateRevanche({ [`apostas/${idx}`]: Math.floor(Math.random() * (bloco.tetoAposta / 5 + 1)) * 5 });
        } else if (r.fase === 'rodada' && !(estadoAgora.respostas || {})[idx]) {
          const acerta = Math.random() < 0.65;
          let valor;
          if (bloco.tipo === 'escolha') valor = acerta ? round.certaIdx : (round.certaIdx + 1) % round.opcoes.length;
          else if (bloco.tipo === 'cronos') valor = acerta ? round.itens.map((_, i) => i) : [...round.itens.map((_, i) => i)].reverse();
          else if (bloco.tipo === 'quatro') valor = { gruposResolvidos: acerta ? round.grupos.length : Math.floor(Math.random() * round.grupos.length) };
          else if (bloco.tipo === 'pistas') valor = acerta ? round.resposta : 'chute errado';
          updateRevanche({ [`respostas/${idx}`]: { valor, tempoMs: Math.floor(Math.random() * 8000), pistaIndexNoAcerto: r.pistasVistas[idx] != null ? r.pistasVistas[idx] - 1 : 0 } });
        }

          if (c.travado) return c;
          const ranking = rankingFromNomesVotos(overflowRef.current.nomes[c.id], overflowRef.current.votos[c.id]);
          return { ...c, vencedor: ranking[0] ? ranking[0].nome : '', votos: ranking[0] ? ranking[0].votos : 0, ranking };
        });
        return { ...prev, premiacao: { ...prev.premiacao, totalVotantes, categorias } };

    });
    return unsub;
  }, []);

  function setCategorias(fn) {
    updateState((prev) => ({ ...prev, premiacao: { ...prev.premiacao, categorias: fn(prev.premiacao.categorias) } }));
  }

  useEffect(() => {

  return html`

          <button class="btn btn-primary btn-block" onClick=${iniciar}>Começar premiação</button>
        </div>
      ` : p.fase === 'fechamento' ? html`
        <div class="round-panel">
          <h2>Fechamento no telão</h2>
          <div class="subtext">Todos os 15 vencedores em grade.</div>
          <button class="btn btn-outline btn-sm" onClick=${() => irPara(p.categorias.length - 1)}>← Voltar pra última categoria</button>
          <button class="btn btn-ghost btn-sm" onClick=${voltarAbertura}>↺ Voltar pra abertura</button>
        </div>
      ` : html`
        <div class="round-panel">
          <div class="categoria-nav">
            <span class="pos">${p.index + 1} de ${p.categorias.length} · ${categoria.emoji} ${categoria.premio}</span>
            <span class="kbd-hint"><kbd>Espaço</kbd> revelar/próxima</span>

            <input type="number" value=${categoria.votos} onInput=${(e) => editarVotos(e.target.value)} />
            ${categoria.travado ? html`<button class="btn btn-ghost btn-sm" onClick=${destravar}>↺ voltar a seguir o voto ao vivo</button>` : html`<span class="subtext">ao vivo</span>`}
          </div>

            `}
            <button class="btn btn-ghost btn-sm" disabled=${p.index === 0} onClick=${voltar}>← Voltar</button>
            <button class="btn btn-ghost btn-sm" onClick=${voltarAbertura}>↺ Voltar pra abertura</button>
          </div>

      <details class="adjust-panel">
        <summary>Lista das 15 categorias (clique pra ir direto)</summary>

          ${p.categorias.map((c, i) => html`
            <div class="categoria-list-item ${i === p.index && p.fase !== 'abertura' && p.fase !== 'fechamento' ? 'current' : ''}" key=${c.id} onClick=${() => irPara(i)}>

function ControlView() {
  const [state, setState] = useState(initialState);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    let cancelled = false;
    fetchInitialState().then((s) => { if (!cancelled) { setState(s); setLoaded(true); } });
    return () => { cancelled = true; };
  }, []);
  // assina ao vivo depois do primeiro fetch — o telão e os celulares escrevem
  // continuamente na Revanche, então o painel precisa ver isso em tempo real
  // (não só uma vez), senão uma ação do painel sobrescreveria o progresso deles.
  useEffect(() => { if (loaded) return subscribeState(setState); }, [loaded]);

  // Fora da Revanche (modo/muted, premiação), ainda é seguro sobrescrever a
  // árvore inteira: só o painel escreve nesses campos. A Revanche em si usa
  // updateRevanche()/updateTop() (patch por caminho) em vez disso, porque o
  // telão e os celulares escrevem lá ao mesmo tempo.
  const updateState = useCallback((updater) => {
    setState((prev) => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      if (next !== prev) pushState(next);
      return next;
    });
  }, []);

  if (!loaded) return html`<div class="control"><div class="round-panel"><h2>Conectando…</h2></div></div>`;

  return html`
    <div class="control">
      <div class="control-header">
        <div class="control-title">TalkFlow 03 · Controle</div>
        <div class="mode-tabs">
          <button class="mode-tab ${state.modo === 'premiacao' ? 'active' : ''}" onClick=${() => updateTop({ modo: 'premiacao' })}>Premiação</button>
          <button class="mode-tab ${state.modo === 'revanche' ? 'active' : ''}" onClick=${() => updateTop({ modo: 'revanche' })}>Revanche</button>
          <button class="mode-tab ${state.modo === 'placar' ? 'active' : ''}" onClick=${() => updateTop({ modo: 'placar' })}>Placar</button>
        </div>
        <div class="header-actions">
          <button class="btn btn-ghost btn-sm" onClick=${() => updateTop({ muted: !state.muted })}>${state.muted ? 'Som: desligado' : 'Som: ligado'}</button>
        </div>
      </div>
      ${state.modo === 'premiacao' ? html`<${PremiacaoControl} state=${state} updateState=${updateState} />`
        : state.modo === 'revanche' ? html`<${RevancheControl} state=${state} updateState=${updateState} />`
        : html`<div class="control-main"><div class="round-panel"><h2>Placar ao vivo no telão</h2><div class="subtext">Volte pra aba Revanche pra controlar a gincana.</div></div><${EquipesAdjust} equipes=${state.revanche.equipes} onAdjust=${(idx, delta) => updateRevanche({ ['equipes/' + idx + '/pontos']: state.revanche.equipes[idx].pontos + delta })} /></div>`}
    </div>
  `;
}

function TimeCronosList({ itens, disabled, onChange }) {
  const [lista, setLista] = useState(() => shuffle(itens));
  const [draggingIdx, setDraggingIdx] = useState(null);
  const [offsetY, setOffsetY] = useState(0);
  const dragIdx = useRef(null);
  const startY = useRef(0);
  const containerRef = useRef(null);
  function onDown(i, e) {
    if (disabled) return;
    dragIdx.current = i; setDraggingIdx(i); setOffsetY(0); startY.current = e.clientY;
    if (e.target.setPointerCapture) e.target.setPointerCapture(e.pointerId);
  }
  function onMove(e) {
    if (dragIdx.current === null) return;
    setOffsetY(e.clientY - startY.current);
    // touch captura o ponteiro no elemento onde o drag começou, então pointerenter
    // dos vizinhos nunca dispara — hit-test manual pra achar quem está embaixo do dedo.
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const itemEl = el && el.closest('.cronos-time-item');
    if (!itemEl || !containerRef.current || !containerRef.current.contains(itemEl)) return;
    const overIdx = Number(itemEl.dataset.idx);
    if (Number.isNaN(overIdx) || overIdx === dragIdx.current) return;
    setLista((l) => { const n = [...l]; const [item] = n.splice(dragIdx.current, 1); n.splice(overIdx, 0, item); dragIdx.current = overIdx; return n; });
    setDraggingIdx(overIdx); setOffsetY(0); startY.current = e.clientY;
  }
  function onUp() { dragIdx.current = null; setDraggingIdx(null); setOffsetY(0); }
  function mover(i, delta) {
    if (disabled) return;
    const j = i + delta;
    if (j < 0 || j >= lista.length) return;
    setLista((l) => { const n = [...l]; [n[i], n[j]] = [n[j], n[i]]; return n; });
  }
  useEffect(() => { onChange(lista.map((it) => it.i)); }, [lista]);
  return html`
    <div class="cronos-time-list" ref=${containerRef} onPointerMove=${onMove} onPointerUp=${onUp} onPointerCancel=${onUp}>
      ${lista.map((item, i) => html`
        <div class="cronos-time-item ${draggingIdx === i ? 'arrastando' : ''}"
          style=${draggingIdx === i ? { transform: `translateY(${offsetY}px)` } : {}}
          data-idx=${i} key=${item.i} onPointerDown=${(e) => onDown(i, e)}>
          <span class="alca">⠿</span><span>${i + 1}. ${item.v}</span>
          <span class="cronos-setas">
            <button type="button" disabled=${disabled || i === 0} onClick=${(e) => { e.stopPropagation(); mover(i, -1); }}>▲</button>
            <button type="button" disabled=${disabled || i === lista.length - 1} onClick=${(e) => { e.stopPropagation(); mover(i, 1); }}>▼</button>
          </span>
        </div>
      `)}
    </div>
  `;
}
function shuffle(arr) {
  const a = arr.map((v, i) => ({ v, i }));
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function TimeRodada({ r, equipeIdx }) {
  const bloco = blocoAtual(r);
  const round = rodadaAtual(r);
  const jaRespondeu = !!(r.respostas || {})[equipeIdx];
  const ms = useContagem(r.deadlineAt, r.paused, r.pausedRemainingMs);
  const relogio = html`<div class="sub" style="text-align:center;">⏱ ${Math.ceil(ms / 1000)}s</div>`;
  const iniciadaEmRef = useRef(Date.now());
  useEffect(() => { iniciadaEmRef.current = Date.now(); }, [r.blocoIndex, r.rodadaIndex]);
  function enviar(valor, extra) {
    if (jaRespondeu) return;
    update(dbRef(db), { [`talkflow/talkflow03/revanche/respostas/${equipeIdx}`]: { valor, tempoMs: Date.now() - iniciadaEmRef.current, ...(extra || {}) } });
  }

  if (bloco.tipo === 'escolha') {
    const [sel, setSel] = useState(null);
    return html`
      <div class="time-body">
        ${relogio}
        <div class="display display-md" style="font-size:1.3rem;">${round.pergunta}</div>
        <div class="opcoes-time">
          ${round.opcoes.map((op, i) => html`
            <button class="opcao-time ${sel === i ? 'sel' : ''}" disabled=${jaRespondeu} onClick=${() => { setSel(i); enviar(i); }} key=${i}>${op}</button>
          `)}
        </div>
        ${jaRespondeu ? html`<div class="sub">Enviado! Aguardando os outros times…</div>` : ''}
      </div>
    `;
  }
  if (bloco.tipo === 'cronos') {
    const [tentativas, setTentativas] = useState(3);
    const ordemRef = useRef([]);
    return html`
      <div class="time-body">
        ${relogio}
        <div class="sub">${round.titulo} — arraste pela ordem certa. Tentativas: ${tentativas}</div>
        <${TimeCronosList} itens=${round.itens} disabled=${jaRespondeu} onChange=${(ordem) => { ordemRef.current = ordem; }} />
        <button class="btn btn-primary" disabled=${jaRespondeu || tentativas <= 0} onClick=${() => {
          const certo = avaliarCronos(ordemRef.current, round);
          if (certo || tentativas <= 1) enviar(ordemRef.current);
          else setTentativas((t) => t - 1);
        }}>Confirmar ordem</button>
        ${jaRespondeu ? html`<div class="sub">Enviado! Aguardando os outros times…</div>` : ''}
      </div>
    `;
  }
  if (bloco.tipo === 'quatro') {
    const palavras = useMemo(() => shuffle(round.grupos.flatMap((g, gi) => g.palavras.map((p) => ({ p, gi })))), [r.blocoIndex, r.rodadaIndex]);
    const [sel, setSel] = useState([]);
    const [resolvidos, setResolvidos] = useState([]);
    const [chances, setChances] = useState(7);
    function toggle(idx) {
      if (jaRespondeu || resolvidos.some((g) => g.includes(idx))) return;
      setSel((s) => s.includes(idx) ? s.filter((x) => x !== idx) : s.length < 4 ? [...s, idx] : s);
    }
    function confirmar() {
      if (sel.length !== 4) return;
      const gis = sel.map((i) => palavras[i].v.gi);
      const certo = gis.every((g) => g === gis[0]);
      if (certo) {
        const novos = [...resolvidos, sel];
        setResolvidos(novos); setSel([]);
        if (novos.length === round.grupos.length) enviar({ gruposResolvidos: novos.length });
      } else {
        const restam = chances - 1; setChances(restam); setSel([]);
        if (restam <= 0) enviar({ gruposResolvidos: resolvidos.length });
      }
    }
    const corGrupo = (idx) => { const r2 = resolvidos.findIndex((g) => g.includes(idx)); return r2 >= 0 ? `solved${palavras[idx].v.gi}` : ''; };
    const containerRef = useRef(null);
    const resolvidosFlat = resolvidos.flat();
    const ordem = [...resolvidosFlat, ...palavras.map((_, i) => i).filter((i) => !resolvidosFlat.includes(i))];
    useFlip(containerRef, { dep: ordem.join(',') });
    return html`
      <div class="time-body">
        ${relogio}
        <div class="sub">Toque em 4 palavras com algo em comum. Chances: ${chances}</div>
        ${resolvidos.map((grupoIdxs, gi2) => html`<div class="quatro-tema-label" key=${gi2}>${round.grupos[palavras[grupoIdxs[0]].v.gi].tema}</div>`)}
        <div class="quatro-time-grid" ref=${containerRef}>
          ${ordem.map((idx) => html`<div class="quatro-time-cel ${sel.includes(idx) ? 'sel' : ''} ${corGrupo(idx)}" data-flip-key=${idx} key=${idx} onClick=${() => toggle(idx)}>${palavras[idx].v.p}</div>`)}
        </div>
        <button class="btn btn-primary" disabled=${jaRespondeu || sel.length !== 4} onClick=${confirmar}>Confirmar grupo</button>
        ${jaRespondeu ? html`<div class="sub">Enviado! Aguardando os outros times…</div>` : ''}
      </div>
    `;
  }
  if (bloco.tipo === 'pistas') {
    const eliminado = r.eliminadosPista.includes(equipeIdx);
    const [chute, setChute] = useState('');
    const vistas = r.pistasVistas[equipeIdx] || 1;
    const podeVerMais = vistas < round.pistas.length;
    const valorAtual = bloco.valoresPista[vistas - 1];
    function verMaisPista() {
      if (!podeVerMais || eliminado || jaRespondeu) return;
      update(dbRef(db), { [`talkflow/talkflow03/revanche/pistasVistas/${equipeIdx}`]: vistas + 1 });
    }
    function pular() { enviar('(pulou a rodada)', { pistaIndexNoAcerto: vistas - 1 }); }
    return html`
      <div class="time-body">
        ${relogio}
        ${round.pistas.slice(0, vistas).map((p, i) => html`<div class="pista-time-box" key=${i}>${i + 1}. ${p}</div>`)}
        <div class="sub" style="text-align:center;">Responder agora vale ${valorAtual} pontos${podeVerMais ? ` · próxima pista vale ${bloco.valoresPista[vistas]}` : ''}</div>
        ${podeVerMais && !eliminado && !jaRespondeu ? html`<button class="btn btn-outline" onClick=${verMaisPista}>Ver próxima pista</button>` : ''}
        <input class="pista-input" placeholder="Quem é / o que é?" value=${chute} disabled=${eliminado || jaRespondeu}
          onInput=${(e) => setChute(e.target.value)} />
        <button class="btn btn-primary" disabled=${eliminado || jaRespondeu || !chute.trim()}
          onClick=${() => enviar(chute, { pistaIndexNoAcerto: vistas - 1 })}>Responder</button>
        <button class="btn btn-ghost" disabled=${eliminado || jaRespondeu} onClick=${pular}>Não sei, pular rodada</button>
        ${eliminado ? html`<div class="sub">Fora da rodada.</div>` : jaRespondeu ? html`<div class="sub">Resposta enviada.</div>` : ''}
      </div>
    `;
  }
  return html`<div class="time-body"><div class="sub">Aguardando…</div></div>`;
}
function TimeResultadoRodada({ r, equipeIdx }) {
  const bloco = blocoAtual(r);
  const round = rodadaAtual(r);
  const resp = (r.respostas || {})[equipeIdx];
  const correta = resp ? avaliarRodada(bloco.tipo, resp.valor, round) : false;
  return html`
    <div class="time-body" style="text-align:center;">
      <div class="resultado-time ${correta ? 'acertou' : 'errou'}">${correta ? '✓ Acertou!' : '✕ Errou'}</div>
      ${equipeIdx === r.primeiroAcerto ? html`<div class="sub">Primeiro a acertar — bônus +5!</div>` : ''}
      ${bloco.tipo === 'pistas' && r.primeiroAcerto !== null ? html`<div class="sub">Resposta: ${round.resposta}</div>` : ''}
    </div>
  `;
}
function TimeView() {
  const [state, setState] = useState(null);
  const myId = useMemo(() => getTimeId(), []);
  useEffect(() => { fetchInitialState().then(setState); return subscribeState(setState); }, []);
  if (!state) return html`<div class="time"><div class="time-body"><div class="pulse sub">Carregando…</div></div></div>`;
  const r = state.revanche;
  const equipeIdx = r.timeConectado.findIndex((id) => id === myId);

  if (equipeIdx === -1) return html`<${TimeCorPicker} equipes=${r.equipes} timeConectado=${r.timeConectado} myId=${myId} />`;
  const minhaEquipe = r.equipes[equipeIdx];

  let corpo;
  if (r.fase === 'entrada') corpo = html`<div class="time-body"><div class="sub" style="text-align:center;">Aguardando o início da Revanche…</div></div>`;
  else if (r.fase === 'aposta') corpo = html`<${TimeAposta} r=${r} equipeIdx=${equipeIdx} />`;
  else if (r.fase === 'revelacaoAposta') corpo = html`<div class="time-body"><div class="sub" style="text-align:center;">Apostas reveladas — próxima rodada já vem.</div></div>`;
  else if (r.fase === 'rodada') corpo = html`<${TimeRodada} r=${r} equipeIdx=${equipeIdx} />`;
  else if (r.fase === 'resultadoRodada') corpo = html`<${TimeResultadoRodada} r=${r} equipeIdx=${equipeIdx} />`;
  else if (r.fase === 'resultadoBloco') corpo = html`<div class="time-body"><div class="sub" style="text-align:center;">Vejam o telão!</div></div>`;
  else corpo = html`<div class="time-body"><div class="sub" style="text-align:center;">Fim da Revanche — vejam o telão!</div></div>`;

  return html`
    <div class="time">
      <div class="time-header">
        <span class="time-pill" style=${{ background: COR_HEX[minhaEquipe.cor] }}>${minhaEquipe.nome}</span>
        <span class="time-pontos">${minhaEquipe.pontos} pts</span>
      </div>
      ${corpo}
    </div>
  `;
}

/* =========================================================
   ROOT
   ========================================================= */
function App() {
  const view = new URLSearchParams(location.search).get('view');
  return html`
    <div>
      <div class="bg-layer bg-waves"></div>
      <div class="bg-layer bg-grain"></div>
      ${view === 'telao' ? html`<${StageView} />` : view === 'painel' ? html`<${ControlView} />` : view === 'time' ? html`<${TimeView} />` : html`<${Landing} />`}
    </div>
  `;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
