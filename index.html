<style>

html,body{margin:0;padding:0;background:var(--preto);color:var(--off-white);font-family:var(--font-body);overflow-x:hidden;}
#app{position:relative;min-height:100vh;}
button,input,select{font-family:var(--font-body);}
a{color:var(--teal-claro);}

.bg-layer{position:fixed;inset:0;pointer-events:none;z-index:0;}
.bg-waves{opacity:.07;background-repeat:no-repeat,no-repeat;

    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><g fill='none' stroke='%23186678' stroke-width='4'><circle cx='300' cy='300' r='60'/><circle cx='300' cy='300' r='130'/><circle cx='300' cy='300' r='200'/><circle cx='300' cy='300' r='270'/></g></svg>");
  background-position:right -220px bottom -220px, left -160px top -160px;
  background-size:900px 900px, 600px 600px;
}

}

.display{font-family:var(--font-display);text-transform:uppercase;letter-spacing:-0.01em;}
.display-huge{font-size:clamp(3.5rem,13vw,11rem);line-height:.94;}
.display-lg{font-size:clamp(2.2rem,7vw,5.5rem);line-height:1;}
.display-md{font-size:clamp(1.4rem,4vw,2.6rem);line-height:1.05;}
.accent{color:var(--teal-claro);}

.btn{font-weight:700;padding:16px 30px;border-radius:999px;border:2px solid transparent;cursor:pointer;font-size:1.05rem;background:transparent;color:var(--off-white);transition:transform .25s var(--ease),background .25s var(--ease),border-color .25s var(--ease),opacity .25s var(--ease);}

.btn-outline{border-color:var(--cinza-claro);}
.btn-outline:hover{border-color:var(--teal-claro);color:var(--teal-claro);}
.btn-ghost{border:none;color:var(--cinza-claro);padding:8px 14px;font-size:.9rem;}
.btn-ghost:hover{color:var(--off-white);}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none;}
.btn-sm{padding:8px 16px;font-size:.85rem;border-radius:999px;}
.btn-block{width:100%;}

.card{background:var(--preto-suave);border-radius:18px;padding:18px;border:1px solid rgba(216,212,202,.10);}
.pill{display:inline-block;padding:4px 14px;border-radius:999px;border:1px solid var(--teal-claro);color:var(--teal-claro);font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}

input[type=text],input[type=number]{background:var(--preto-suave);border:1px solid var(--cinza-claro);color:var(--off-white);border-radius:10px;padding:10px 12px;font-size:1rem;}

select{background:var(--preto-suave);border:1px solid var(--cinza-claro);color:var(--off-white);border-radius:8px;padding:6px 8px;font-size:.9rem;}

::-webkit-scrollbar{width:10px;}
::-webkit-scrollbar-thumb{background:var(--preto-suave);border-radius:10px;}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
@keyframes popIn{from{opacity:0;transform:scale(.55) translateY(30px);}to{opacity:1;transform:scale(1) translateY(0);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
@keyframes pulseScale{0%,100%{transform:scale(1);}50%{transform:scale(1.04);}}
.fade-up{animation:fadeUp .5s var(--ease);}
.pop-in{animation:popIn .6s var(--ease);}
.pulse{animation:pulse 1.8s ease-in-out infinite;}
.pulse-scale{animation:pulseScale 2.2s ease-in-out infinite;}

/* ---- telão ---- */

.categoria-emoji{font-size:clamp(4rem,12vw,9rem);line-height:1;}
.premio-explicacao{color:var(--cinza-claro);font-size:clamp(1.1rem,2.8vw,1.6rem);}

.trophy-wrap{position:relative;width:min(40vw,260px);margin:0 auto;}
.trophy-emoji{position:absolute;top:8%;left:50%;transform:translateX(-50%);font-size:clamp(2.2rem,7vw,4.5rem);}

.rank-row{display:flex;align-items:center;gap:18px;}
.rank-name{width:min(32vw,280px);text-align:right;font-family:var(--font-display);font-size:clamp(1.1rem,2.4vw,2rem);flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;gap:8px;}

.rank-bar{position:absolute;inset:0;border-radius:14px;transform-origin:left center;transition:transform 1s var(--ease),background 1s var(--ease);}

.podium-block{width:min(28vw,240px);border-radius:16px 16px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:14px;}

.control{min-height:100vh;display:flex;flex-direction:column;padding:16px 20px 20px;gap:14px;position:relative;z-index:1;}
.control-header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;}
.control-title{font-family:var(--font-display);font-size:1.5rem;letter-spacing:.03em;}
.header-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.control-main{flex:1;display:flex;flex-direction:column;gap:16px;}

.mode-tabs{display:flex;gap:8px;flex-wrap:wrap;}

.vencedor-edit{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.vencedor-edit input[type=text]{flex:1;min-width:160px;}
.categoria-list{display:flex;flex-direction:column;gap:4px;max-height:40vh;overflow:auto;}
.categoria-list-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:.9rem;}
.categoria-list-item:hover{background:var(--preto-suave);}
.categoria-list-item.current{background:rgba(24,102,120,.22);}
.categoria-list-item .cemoji{font-size:1.1rem;}
.categoria-list-item .cpremio{flex:1;}
.categoria-list-item .cvencedor{color:var(--cinza-claro);font-size:.8rem;}

.equipes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.equipe-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--preto-suave);border-radius:10px;padding:8px 10px;border-left:4px solid var(--cor);}

.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--cinza-claro);background:transparent;color:var(--off-white);cursor:pointer;font-size:.9rem;}

.posicao-grid{display:flex;flex-direction:column;gap:6px;}
.posicao-row{display:flex;align-items:center;gap:10px;background:var(--preto-suave);border-radius:10px;padding:8px 10px;border-left:4px solid var(--cor);}
.posicao-row .nome{flex:1;font-weight:700;}

.adjust-panel{background:var(--preto-suave);border-radius:14px;padding:12px 16px;}
.adjust-panel summary{cursor:pointer;font-weight:700;color:var(--cinza-claro);}

.kbd-hint{font-size:.75rem;color:var(--cinza-claro);}
.kbd-hint kbd{background:var(--preto-suave);border:1px solid var(--cinza-claro);border-radius:4px;padding:1px 6px;font-family:var(--font-body);}

@media (max-width:600px){
  .control{padding:12px 14px 18px;gap:12px;}
  .control-title{font-size:1.3rem;}
  .kbd-hint{display:none;}
  .btn{padding:15px 24px;font-size:1rem;min-height:48px;}
  .btn-sm{min-height:40px;padding:10px 16px;}
}
</style>

<body>
<div id="app"></div>

<script type="module">
import { h, render } from 'https://esm.sh/preact@10.19.6';
import { useState, useEffect, useRef, useCallback, useMemo } from 'https://esm.sh/preact@10.19.6/hooks';
import htm from 'https://esm.sh/htm@3.1.1';

import { getDatabase, ref as dbRef, set, onValue, get } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js';

const html = htm.bind(h);
const LOGO_URL = 'https://flow.1b.org.br/wp-content/uploads/2026/08/logo-flow-2026.png';

/* =========================================================
   CONFIGURAÇÃO — editar aqui
   ========================================================= */
const CATEGORIAS_PREMIACAO = [
  { id: 1, premio: 'Jovem Êutico', explicacao: 'Quem mais dormiu', emoji: '😴' },

  { id: 13, premio: 'Mimimi', explicacao: 'O mais reclamão', emoji: '😭' },
  { id: 14, premio: 'Sola Scriptura', explicacao: 'Quem mais sabia de Bíblia', emoji: '📖' },
  { id: 15, premio: 'Servo Sofredor', explicacao: 'Quem mais serviu, trabalhou e ajudou', emoji: '🛠️' },
];

const COR_HEX = {
  azul: '#2563EB', amarelo: '#EAB308', cinza: '#9CA3AF', vermelho: '#DC2626',
  verde: '#16A34A', laranja: '#EA580C', branco: '#F2F0EA', preto: '#3A3A3A',
  lilas: '#A78BFA', rosa: '#EC4899',
};
const EQUIPES_INICIAIS = [
  { nome: 'AZUL', cor: 'azul', pontos: 805 },
  { nome: 'AMARELO', cor: 'amarelo', pontos: 795 },
  { nome: 'CINZA', cor: 'cinza', pontos: 760 },
  { nome: 'VERMELHO', cor: 'vermelho', pontos: 755 },
  { nome: 'VERDE', cor: 'verde', pontos: 755 },
  { nome: 'LARANJA', cor: 'laranja', pontos: 750 },
  { nome: 'BRANCO', cor: 'branco', pontos: 745 },
  { nome: 'PRETO', cor: 'preto', pontos: 740 },
  { nome: 'LILÁS', cor: 'lilas', pontos: 735 },
  { nome: 'ROSA', cor: 'rosa', pontos: 730 },
];
const PONTOS_PADRAO = [100, 90, 85, 80, 75, 70, 65, 60, 55, 50];
const PROVAS_INICIAIS = [
  { id: 1, nome: 'Prova 1 (exemplo — editar)', descricao: 'Descrição da prova 1.', pontos: PONTOS_PADRAO },
  { id: 2, nome: 'Prova 2 (exemplo — editar)', descricao: 'Descrição da prova 2.', pontos: PONTOS_PADRAO },
  { id: 3, nome: 'Prova 3 (exemplo — editar)', descricao: 'Descrição da prova 3.', pontos: PONTOS_PADRAO },
];

/* =========================================================
   SINCRONIZAÇÃO — Firebase Realtime Database. Mesmo projeto
   dos apps TalkFlow, path próprio. Painel escreve, telão só lê.
   ========================================================= */
const firebaseConfig = {
  apiKey: 'AIzaSyAKN8mRoXydV52eF1QZYNgJ_C0VFQPVTnM',
  authDomain: 'talkflow-dba50.firebaseapp.com',
  databaseURL: 'https://talkflow-dba50-default-rtdb.firebaseio.com',
  projectId: 'talkflow-dba50',
  storageBucket: 'talkflow-dba50.firebasestorage.app',
  messagingSenderId: '388105576650',
  appId: '1:388105576650:web:dc25b4d124d18809499433',
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const stateRef = dbRef(db, 'talkflow/talkflow03');

function pushState(state) { set(stateRef, state); }
// RTDB não guarda array vazio nem buraco em array (vira null) — reconstitui.
function sanitizeState(raw) {
  const base = initialState();
  if (!raw) return base;
  return {
    ...base, ...raw,
    premiacao: { ...base.premiacao, ...(raw.premiacao || {}), categorias: (raw.premiacao && raw.premiacao.categorias) || base.premiacao.categorias },
    revanche: {
      ...base.revanche, ...(raw.revanche || {}),
      equipes: (raw.revanche && raw.revanche.equipes) || base.revanche.equipes,
      provas: (raw.revanche && raw.revanche.provas) || base.revanche.provas,
      colocacao: (raw.revanche && raw.revanche.colocacao) || {},
    },
  };
}
function subscribeState(handler) {
  return onValue(stateRef, (snap) => { if (snap.exists()) handler(sanitizeState(snap.val())); });
}
async function fetchInitialState() {
  try {
    const snap = await get(stateRef);
    return snap.exists() ? sanitizeState(snap.val()) : initialState();
  } catch (e) { return initialState(); }
}

/* =========================================================
   SONS — Web Audio API, sem arquivos externos
   ========================================================= */
let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function beep(freq, start, dur, type, gain) {
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  g.gain.value = gain || 0.2;
  osc.connect(g); g.connect(ctx.destination);
  const t0 = ctx.currentTime + start;
  osc.start(t0);
  g.gain.setValueAtTime(g.gain.value, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.stop(t0 + dur + 0.02);
}
function playFanfarra() { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => beep(f, i * 0.09, 0.35, 'triangle', 0.25)); }
function playTamborSuspense() { beep(90, 0, 0.18, 'sine', 0.1); }
function playLargada() { beep(440, 0, 0.12, 'square', 0.2); beep(880, 0.12, 0.15, 'square', 0.2); }
function playFimTempo() { for (let i = 0; i < 3; i++) beep(220, i * 0.22, 0.16, 'sawtooth', 0.22); }
function playCelebracao() { [392, 523.25, 659.25, 783.99, 1046.5].forEach((f, i) => beep(f, i * 0.1, 0.4, 'triangle', 0.22)); }
function playSoundByName(name) {
  if (name === 'fanfarra') playFanfarra();
  else if (name === 'largada') playLargada();
  else if (name === 'fimTempo') playFimTempo();
  else if (name === 'celebracao') playCelebracao();
}

/* =========================================================
   ESTADO
   ========================================================= */
function initialState() {
  return {
    modo: 'premiacao', // premiacao | revanche | placar
    muted: false,
    soundSeq: 0,
    sound: null,
    premiacao: {
      categorias: CATEGORIAS_PREMIACAO.map((c) => ({ ...c, vencedor: '', votos: 0, ranking: [] })),
      totalVotantes: 0,
      index: 0,
      fase: 'abertura', // abertura | categoria | vencedor | fechamento
      mostrarRanking: false,
    },
    revanche: {
      equipes: EQUIPES_INICIAIS.map((e) => ({ ...e, pontosIniciais: e.pontos })),
      provas: PROVAS_INICIAIS,
      provaIndex: 0,
      fase: 'overflowPlacar', // overflowPlacar | prova | resultadoFinal
      subfase: 'A', // A=prova | B=resultado | C=placarAtualizado
      colocacao: {},
      prevRanking: null,
    },
  };
}
function sortedEquipesIdx(equipes) {
  return equipes.map((e, idx) => idx).sort((a, b) => equipes[b].pontos - equipes[a].pontos);
}
function posicaoAntes(equipes, idx) {
  const ordem = equipes.map((e, i) => i).sort((a, b) => equipes[b].pontosIniciais - equipes[a].pontosIniciais);
  return ordem.indexOf(idx) + 1;
}
function downloadNothing() {}

/* =========================================================
   CONFETE
   ========================================================= */
function Confetti() {
  const ref = useRef(null);
  useEffect(() => {
    const canvas = ref.current;
    const ctx = canvas.getContext('2d');
    let raf = 0;
    const colors = ['#EBE8E0', '#186678', '#2589A0', '#D8D4CA'];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);
    const particles = Array.from({ length: 180 }, () => ({
      x: Math.random() * canvas.width, y: -20 - Math.random() * canvas.height,
      w: 6 + Math.random() * 8, h: 6 + Math.random() * 10,
      vy: 1.5 + Math.random() * 2.5, vx: -1 + Math.random() * 2,
      rot: Math.random() * Math.PI, vrot: -0.15 + Math.random() * 0.3,
      color: colors[Math.floor(Math.random() * colors.length)],
    }));
    function frame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p) => {
        p.y += p.vy; p.x += p.vx; p.rot += p.vrot;
        if (p.y > canvas.height + 20) { p.y = -20; p.x = Math.random() * canvas.width; }
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      });
      raf = requestAnimationFrame(frame);
    }
    frame();
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', resize); };
  }, []);
  return html`<canvas class="confetti" ref=${ref}></canvas>`;
}

function PremiacaoControl({ state, updateState }) {
  const p = state.premiacao;
  const categoria = p.categorias[p.index];
  const fileRef = useRef(null);

  function setCategorias(fn) {
    updateState((prev) => ({ ...prev, premiacao: { ...prev.premiacao, categorias: fn(prev.premiacao.categorias) } }));
  }
  function iniciar() {
    updateState((prev) => ({ ...prev, premiacao: { ...prev.premiacao, fase: 'categoria', index: 0 } }));
  }
  function revelar() {
    updateState((prev) => ({ ...prev, premiacao: { ...prev.premiacao, fase: 'vencedor', mostrarRanking: false }, sound: 'fanfarra', soundSeq: prev.soundSeq + 1 }));
  }
  function proxima() {
    updateState((prev) => {
      const pr = prev.premiacao;
      if (pr.index >= pr.categorias.length - 1) return { ...prev, premiacao: { ...pr, fase: 'fechamento' } };
      return { ...prev, premiacao: { ...pr, index: pr.index + 1, fase: 'categoria', mostrarRanking: false }, sound: 'largada', soundSeq: prev.soundSeq + 1 };
    });
  }
  function pular() {
    updateState((prev) => {
      const pr = prev.premiacao;
      if (pr.index >= pr.categorias.length - 1) return { ...prev, premiacao: { ...pr, fase: 'fechamento' } };
      return { ...prev, premiacao: { ...pr, index: pr.index + 1, fase: 'categoria', mostrarRanking: false } };
    });
  }
  function voltar() {
    updateState((prev) => { const pr = prev.premiacao; if (pr.index <= 0) return prev; return { ...prev, premiacao: { ...pr, index: pr.index - 1, fase: 'categoria', mostrarRanking: false } }; });
  }
  function irPara(idx) {
    updateState((prev) => ({ ...prev, premiacao: { ...prev.premiacao, index: idx, fase: 'categoria', mostrarRanking: false } }));
  }
  function toggleRanking() {
    updateState((prev) => ({ ...prev, premiacao: { ...prev.premiacao, mostrarRanking: !prev.premiacao.mostrarRanking } }));
  }
  function editarVencedor(value) {
    setCategorias((cs) => cs.map((c, i) => i === p.index ? { ...c, vencedor: value } : c));
  }
  function editarVotos(value) {
    const votos = Number(value); if (!Number.isFinite(votos)) return;
    setCategorias((cs) => cs.map((c, i) => i === p.index ? { ...c, votos } : c));
  }
  function carregarJson(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        const porId = {};
        (data.categorias || []).forEach((c) => { porId[c.id] = c; });
        updateState((prev) => ({
          ...prev,
          premiacao: {
            ...prev.premiacao,
            totalVotantes: data.totalVotantes || 0,
            categorias: prev.premiacao.categorias.map((c) => {
              const found = porId[c.id];
              return found ? { ...c, vencedor: found.vencedor || '', votos: found.votos || 0, ranking: found.ranking || [] } : c;
            }),
          },
        }));
      } catch (e) { alert('JSON inválido: ' + e.message); }
    };
    reader.readAsText(file);
  }

  useEffect(() => {
    function onKey(e) {
      const tag = e.target && e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (e.code !== 'Space') return;
      e.preventDefault();
      if (p.fase === 'categoria') revelar();
      else if (p.fase === 'vencedor') proxima();
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [p.fase, p.index]);

  return html`
    <div class="control-main">
      ${p.fase === 'abertura' ? html`
        <div class="round-panel">
          <h2>Overflow Awards — abertura</h2>
          <div class="subtext">Carregue o resultado da votação antes de começar (opcional — dá pra editar na mão também).</div>
          <input ref=${fileRef} type="file" accept="application/json" style="display:none" onChange=${(e) => e.target.files[0] && carregarJson(e.target.files[0])} />
          <div class="controls-row">
            <button class="btn btn-outline" onClick=${() => fileRef.current.click()}>Carregar JSON da votação</button>
            <input type="number" value=${p.totalVotantes} onInput=${(e) => updateState((prev) => ({ ...prev, premiacao: { ...prev.premiacao, totalVotantes: Number(e.target.value) || 0 } }))} />
            <span class="subtext">pessoas votaram</span>
          </div>
          <button class="btn btn-primary btn-block" onClick=${iniciar}>Começar premiação</button>
        </div>
      ` : p.fase === 'fechamento' ? html`
        <div class="round-panel">
          <h2>Fechamento no telão</h2>
          <div class="subtext">Todos os 15 vencedores em grade.</div>
          <button class="btn btn-outline btn-sm" onClick=${() => irPara(p.categorias.length - 1)}>← Voltar pra última categoria</button>
        </div>
      ` : html`
        <div class="round-panel">
          <div class="categoria-nav">
            <span class="pos">${p.index + 1} de ${p.categorias.length} · ${categoria.emoji} ${categoria.premio}</span>
            <span class="kbd-hint"><kbd>Espaço</kbd> revelar/próxima</span>
          </div>
          <div class="vencedor-edit">
            <input type="text" placeholder="Nome do vencedor" value=${categoria.vencedor} onInput=${(e) => editarVencedor(e.target.value)} />
            <input type="number" value=${categoria.votos} onInput=${(e) => editarVotos(e.target.value)} />
          </div>
          <div class="controls-row">
            ${p.fase === 'categoria' ? html`
              <button class="btn btn-primary" onClick=${revelar}>Revelar</button>
              <button class="btn btn-ghost" onClick=${pular}>Pular categoria</button>
            ` : html`
              <button class="btn btn-primary" onClick=${proxima}>Próxima categoria</button>
              <button class="btn ${p.mostrarRanking ? 'btn-primary' : 'btn-outline'} btn-sm" onClick=${toggleRanking}>${p.mostrarRanking ? 'Mostrando ranking' : 'Mostrar ranking (top 3)'}</button>
            `}
            <button class="btn btn-ghost btn-sm" disabled=${p.index === 0} onClick=${voltar}>← Voltar</button>
          </div>
        </div>
      `}
      <details class="adjust-panel">
        <summary>Lista das 15 categorias (clique pra ir direto)</summary>
        <div class="categoria-list">
          ${p.categorias.map((c, i) => html`
            <div class="categoria-list-item ${i === p.index && p.fase !== 'abertura' && p.fase !== 'fechamento' ? 'current' : ''}" key=${c.id} onClick=${() => irPara(i)}>
              <span class="cemoji">${c.emoji}</span>
              <span class="cpremio">${c.premio}</span>
              <span class="cvencedor">${c.vencedor || '—'}</span>
            </div>
          `)}
        </div>
      </details>
    </div>
  `;
}

function RevancheControl({ state, updateState }) {
  const r = state.revanche;
  const prova = r.provas[r.provaIndex];

  function adjustPonto(idx, delta) {
    updateState((prev) => ({ ...prev, revanche: { ...prev.revanche, equipes: prev.revanche.equipes.map((e, i) => i === idx ? { ...e, pontos: e.pontos + delta } : e) } }));
  }
  function comecarProvas() {
    updateState((prev) => ({ ...prev, revanche: { ...prev.revanche, fase: 'prova', provaIndex: 0, subfase: 'A' } }));
  }
  function lancarResultado() {
    const ordemAtual = sortedEquipesIdx(r.equipes);
    const colocacao = {};
    ordemAtual.forEach((idx, pos) => { colocacao[idx] = pos + 1; });
    updateState((prev) => ({ ...prev, revanche: { ...prev.revanche, subfase: 'B', colocacao } }));
  }
  function setColocacao(idx, pos) {
    updateState((prev) => ({ ...prev, revanche: { ...prev.revanche, colocacao: { ...prev.revanche.colocacao, [idx]: Number(pos) } } }));
  }
  function confirmarResultado() {
    const posicoes = Object.values(r.colocacao);
    const valido = posicoes.length === r.equipes.length && new Set(posicoes).size === posicoes.length;
    if (!valido) { alert('Cada equipe precisa de uma posição única, sem repetir.'); return; }
    const prevRanking = sortedEquipesIdx(r.equipes);
    updateState((prev) => {
      const pr = prev.revanche;
      const equipes = pr.equipes.map((e, idx) => {
        const pos = pr.colocacao[idx];
        const delta = pr.provas[pr.provaIndex].pontos[pos - 1] || 0;
        return { ...e, pontos: e.pontos + delta };
      });
      return { ...prev, revanche: { ...pr, equipes, subfase: 'C', prevRanking }, sound: 'celebracao', soundSeq: prev.soundSeq + 1 };
    });
  }
  function proximaProva() {
    updateState((prev) => {
      const pr = prev.revanche;
      if (pr.provaIndex >= pr.provas.length - 1) return { ...prev, revanche: { ...pr, fase: 'resultadoFinal' } };
      return { ...prev, revanche: { ...pr, provaIndex: pr.provaIndex + 1, subfase: 'A', colocacao: {}, prevRanking: null }, sound: 'largada', soundSeq: prev.soundSeq + 1 };
    });
  }
  function voltarProva() {
    updateState((prev) => { const pr = prev.revanche; if (pr.provaIndex <= 0) return prev; return { ...prev, revanche: { ...pr, provaIndex: pr.provaIndex - 1, subfase: 'A', colocacao: {}, prevRanking: null } }; });
  }
  function irResultadoFinal() {
    updateState((prev) => ({ ...prev, revanche: { ...prev.revanche, fase: 'resultadoFinal' }, sound: 'celebracao', soundSeq: prev.soundSeq + 1 }));
  }
  function resetarRevanche() {
    if (!confirm('Resetar a Revanche? Os pontos voltam pro placar inicial do Overflow (as provas já lançadas são desfeitas).')) return;
    updateState((prev) => ({
      ...prev,
      revanche: {
        ...prev.revanche,
        equipes: prev.revanche.equipes.map((e) => ({ ...e, pontos: e.pontosIniciais })),
        provaIndex: 0, fase: 'overflowPlacar', subfase: 'A', colocacao: {}, prevRanking: null,
      },
    }));
  }
  function editarNomeProva(value) {
    updateState((prev) => ({ ...prev, revanche: { ...prev.revanche, provas: prev.revanche.provas.map((pv, i) => i === r.provaIndex ? { ...pv, nome: value } : pv) } }));
  }
  function editarDescProva(value) {
    updateState((prev) => ({ ...prev, revanche: { ...prev.revanche, provas: prev.revanche.provas.map((pv, i) => i === r.provaIndex ? { ...pv, descricao: value } : pv) } }));
  }

  return html`
    <div class="control-main">
      ${r.fase === 'overflowPlacar' ? html`
        <div class="round-panel">
          <h2>Placar do Overflow (antes da Revanche)</h2>
          <div class="subtext">Primeira tela da Parte 2. Mostra o placar que veio do retiro.</div>
          <button class="btn btn-primary btn-block" onClick=${comecarProvas}>Começar as provas</button>
        </div>
      ` : r.fase === 'resultadoFinal' ? html`
        <div class="round-panel">
          <h2>Resultado final no telão</h2>
          <div class="subtext">Pódio com campeão e posição anterior.</div>
          <button class="btn btn-outline btn-sm" onClick=${() => updateState((prev) => ({ ...prev, revanche: { ...prev.revanche, fase: 'prova' } }))}>← Voltar pras provas</button>
        </div>
      ` : html`
        <div class="round-panel">
          <div class="categoria-nav">
            <span class="pos">Prova ${r.provaIndex + 1} de ${r.provas.length}</span>
          </div>
          <div class="vencedor-edit">
            <input type="text" placeholder="Nome da prova" value=${prova.nome} onInput=${(e) => editarNomeProva(e.target.value)} />
          </div>
          <input type="text" placeholder="Descrição" value=${prova.descricao} onInput=${(e) => editarDescProva(e.target.value)} />
          ${r.subfase === 'A' ? html`
            <div class="controls-row">
              <button class="btn btn-primary" onClick=${lancarResultado}>Lançar resultado</button>
              <button class="btn btn-ghost btn-sm" disabled=${r.provaIndex === 0} onClick=${voltarProva}>← Prova anterior</button>
            </div>
          ` : r.subfase === 'B' ? html`
            <div class="posicao-grid">
              ${r.equipes.map((e, idx) => html`
                <div class="posicao-row" style=${{ '--cor': COR_HEX[e.cor] }} key=${idx}>
                  <span class="nome">${e.nome}</span>
                  <select value=${r.colocacao[idx] || ''} onChange=${(ev) => setColocacao(idx, ev.target.value)}>
                    <option value="">posição…</option>
                    ${r.equipes.map((_, p2) => html`<option key=${p2} value=${p2 + 1}>${p2 + 1}º</option>`)}
                  </select>
                </div>
              `)}
            </div>
            <button class="btn btn-primary btn-block" onClick=${confirmarResultado}>Confirmar resultado</button>
          ` : html`
            <div class="controls-row">
              <button class="btn btn-primary" onClick=${proximaProva}>${r.provaIndex >= r.provas.length - 1 ? 'Ir pro resultado final' : 'Próxima prova'}</button>
            </div>
          `}
        </div>
      `}
      <div class="controls-row">
        <button class="btn btn-outline btn-sm" onClick=${() => updateState((prev) => ({ ...prev, modo: 'placar' }))}>Mostrar placar ao vivo</button>
        <button class="btn btn-outline btn-sm" onClick=${irResultadoFinal}>Ir direto pro resultado final</button>
        <button class="btn btn-ghost btn-sm" onClick=${resetarRevanche}>Resetar revanche</button>
      </div>
      <${EquipesAdjust} equipes=${r.equipes} onAdjust=${adjustPonto} />
    </div>
  `;
}

/* =========================================================
   PAINEL — ROOT
   ========================================================= */
function ControlView() {
  const [state, setState] = useState(initialState);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    let cancelled = false;
    fetchInitialState().then((s) => { if (!cancelled) { setState(s); setLoaded(true); } });
    return () => { cancelled = true; };
  }, []);

  const updateState = useCallback((updater) => {
    setState((prev) => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      if (next !== prev) pushState(next);
      return next;
    });
  }, []);

  if (!loaded) return html`<div class="control"><div class="round-panel"><h2>Conectando…</h2></div></div>`;

  return html`
    <div class="control">
      <div class="control-header">
        <div class="control-title">TalkFlow 03 · Controle</div>
        <div class="mode-tabs">
          <button class="mode-tab ${state.modo === 'premiacao' ? 'active' : ''}" onClick=${() => updateState((prev) => ({ ...prev, modo: 'premiacao' }))}>Premiação</button>
          <button class="mode-tab ${state.modo === 'revanche' ? 'active' : ''}" onClick=${() => updateState((prev) => ({ ...prev, modo: 'revanche' }))}>Revanche</button>
          <button class="mode-tab ${state.modo === 'placar' ? 'active' : ''}" onClick=${() => updateState((prev) => ({ ...prev, modo: 'placar' }))}>Placar</button>
        </div>
        <div class="header-actions">
          <button class="btn btn-ghost btn-sm" onClick=${() => updateState((prev) => ({ ...prev, muted: !prev.muted }))}>${state.muted ? 'Som: desligado' : 'Som: ligado'}</button>
        </div>
      </div>
      ${state.modo === 'premiacao' ? html`<${PremiacaoControl} state=${state} updateState=${updateState} />`
        : state.modo === 'revanche' ? html`<${RevancheControl} state=${state} updateState=${updateState} />`
        : html`<div class="control-main"><div class="round-panel"><h2>Placar ao vivo no telão</h2><div class="subtext">Volte pra aba Revanche pra seguir as provas.</div></div><${EquipesAdjust} equipes=${state.revanche.equipes} onAdjust=${(idx, delta) => updateState((prev) => ({ ...prev, revanche: { ...prev.revanche, equipes: prev.revanche.equipes.map((e, i) => i === idx ? { ...e, pontos: e.pontos + delta } : e) } }))} /></div>`}
    </div>
  `;
}

/* =========================================================
   ROOT
   ========================================================= */
function App() {
  const view = new URLSearchParams(location.search).get('view');
  return html`
    <div>
      <div class="bg-layer bg-waves"></div>
      <div class="bg-layer bg-grain"></div>
      ${view === 'telao' ? html`<${StageView} />` : view === 'painel' ? html`<${ControlView} />` : html`<${Landing} />`}
    </div>
  `;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
